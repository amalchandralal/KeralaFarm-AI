version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: agrovision-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=agrovision
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    container_name: agrovision-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
